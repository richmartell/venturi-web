<style>
/* Layout: one screen, lockup centred, one line of mono at the foot. Single theme: Venturi Graphite. */
:root{
  --surface-100:#16191a;
  --ink:#f2f3f3;
  --ink-muted:#a8b1b4;
  --line:#313638;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--surface-100);color:var(--ink);font-family:var(--mono);-webkit-font-smoothing:antialiased}
.page{min-height:100%;display:flex;flex-direction:column;padding-inline:24px;padding-block:32px}
main{flex:1;display:flex;align-items:center;justify-content:center}
.lockup{display:block;width:min(442px,72vw);height:auto}
.lockup path{fill:var(--ink)}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 24px;padding-top:24px;border-top:1px solid var(--line)}
footer span{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
footer a{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted);text-decoration:none}
footer a:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--ink-muted);outline-offset:4px}
</style>
</head>
<body>
